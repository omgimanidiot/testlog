name: build-dylib
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -dynamiclib -arch arm64 -miphoneos-version-min=15.0 -isysroot "$SDK" -fobjc-arc -O1 -Wall -framework UIKit -framework Foundation -Wl,-install_name,@rpath/TTMTrace.dylib Tweak.m -o build/TTMTrace.dylib
          codesign -f -s - build/TTMTrace.dylib || true
          file build/TTMTrace.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: TTMTrace-dylib
          path: build/TTMTrace.dylib
